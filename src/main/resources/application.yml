# 공통 설정. 접속 정보·키는 여기에 적지 마십시오.
# 로컬 값은 application-local.yml 에 두고, 그 파일은 .gitignore 에 이미 있습니다.

spring:
  application:
    name: now
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 사람이 만듭니다. 앱이 테이블을 바꾸지 않습니다
    properties:
      hibernate:
        format_sql: true
    open-in-view: false         # 컨트롤러에서 지연 로딩이 터지는 것을 막습니다

server:
  port: 8080
  servlet:
    context-path: /api/v1       # 명세서의 {BASE_URL}/api/v1 과 맞춥니다

app:
  cors:
    # 프론트 배포 주소를 여기에. 빠뜨리면 화면에서 API 가 전부 실패합니다
    origins: http://localhost:5173
  jwt:
    # ★ 실서버에서는 반드시 환경 변수로 덮으십시오 — APP_JWT_SECRET
    #   32바이트 미만이면 앱이 시작할 때 막습니다
    secret: ${APP_JWT_SECRET:로컬전용_기본_서명키_실서버에서는_반드시_환경변수로_덮으십시오}
    valid-seconds: 2592000        # 30일. 게스트가 앱을 다시 열었을 때 이어지도록
  llm:
    # 2026-08-20 OpenAI 크레딧을 쓰기로 했습니다.
    #
    # ★ 키가 비어 있어도 앱은 정상적으로 뜹니다. 이건 의도입니다 —
    #   호출이 실패하면 폴백 문장으로 채우게 되어 있어서, 키가 없으면
    #   그냥 처음부터 폴백으로 갑니다. generatedBy 에 fallback 이 남습니다.
    #   DB 접속 정보와 달리 「없으면 실패」로 두지 않는 이유가 이것입니다.
    api-key: ${FROMNOWON_OPENAI_API_KEY:}
    model:   ${FROMNOWON_OPENAI_MODEL:gpt-5.6-luna}
    # 호출 규약은 docs/prompts/00-index.md 와 같습니다 — 타임아웃 6초 · 재시도 1회
    timeout-seconds: 6
    max-retries: 1

---
# local — 각자 PC 의 MySQL 을 씁니다. H2 는 2026-08-18 에 제거했습니다.
#
# ★ 실행 전에 세 가지가 준비돼 있어야 합니다
#   1. 로컬에 MySQL 8.0.16 이상이 떠 있을 것
#   2. fromnowon_db 를 만들고 docs/schema_v63.sql 을 적용해 두었을 것
#   3. application-local.yml 에 접속 정보를 적어 두었을 것 (.gitignore 대상)
#      → 없으면 application-local.yml.example 을 복사해서 쓰십시오
#
# ddl-auto 는 위쪽 공통 설정의 validate 를 그대로 씁니다.
# 앱이 시작할 때 엔티티와 실제 테이블이 맞는지 대조합니다 —
# 어긋나면 서버가 아니라 여기서 먼저 걸립니다. 그게 이 설정의 목적입니다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 접속 정보는 application-local.yml 에 적습니다. 여기에 적지 마십시오
    url: ${DB_URL:jdbc:mysql://localhost:3306/fromnowon_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}

---
# prod — 실서버. ★ 값을 하나도 기본값으로 두지 않았습니다.
#
# 환경 변수가 빠지면 앱이 「조용히 잘못된 상태로 뜨는」 대신 곧바로 실패합니다.
# 그게 의도입니다 — 기본값을 두면 DB 없이 뜨거나 공개된 서명 키로 도는 것을
# 발표 직전까지 아무도 모릅니다.
#
# ★ 실행할 때 SPRING_PROFILES_ACTIVE=prod 를 반드시 지정하십시오.
#   빠뜨리면 위쪽 profiles.default 에 따라 local 로 떠서 엉뚱한 DB 를 봅니다.
#   기동 로그에 The following 1 profile is active: "prod" 가 찍히는지 확인하십시오.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  cors:
    origins: ${CORS_ORIGINS}
  jwt:
    secret: ${APP_JWT_SECRET}
